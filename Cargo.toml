[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "2.3.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
# Internal
conduit-op-reth-node = { path = "crates/node" }
conduit-op-reth-rpc-api = { path = "crates/rpc-api" }

# Reth (op-rs/reth @ op-reth/v2.4.3 workspace pin)
reth-ethereum-cli = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1" }
