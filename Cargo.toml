alloy-rpc-types-engine = "2.1.1"
alloy-signer-local = "2.1.1"
alloy-network = "2.1.1"

# Other
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre = "0.6"
tempfile = "3"
futures-util = "0.3.31"
jsonrpsee = "0.26"

# Unify op-alloy/alloy-op crates so crates.io transitive deps resolve to the same
# git versions used by the ethereum-optimism/optimism repo.
[patch.crates-io]
op-alloy-consensus = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v2.4.3" }
op-alloy-rpc-types = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v2.4.3" }
op-alloy-rpc-types-engine = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v2.4.3" }
op-alloy-rpc-jsonrpsee = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v2.4.3" }
op-alloy-network = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v2.4.3" }
alloy-op-evm = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v2.4.3" }
alloy-op-hardforks = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v2.4.3" }
op-revm = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v2.4.3" }

# Keep debug test links under the Linux lld relocation limit after the reth v2.3
# dependency graph expansion. Line tables preserve useful file/line backtraces while
# avoiding full DWARF macro/type debug sections from large native dependencies.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

# Conduit reth fork: op-rs/reth @ aef8d3ef (op-reth v2.4.3) plus two fixes, on
# conduitxyz/reth branch `conduit/op-reth-v2.4.3-fixes`:
# - reth-db-common: `init-state` left the genesis alloc storage next to the imported dump's
#   storage in the DupSort storage tables, so execution could read stale genesis slots. Each
#   dump slot now replaces only the same genesis slot; slots the dump omits survive.
# - reth-provider: RocksDB history shard lookups had no upper bound, making the unwind after
#   a state import O(accounts^2).
# Every op-rs/reth crate in the graph is patched, not just the two fixed ones: crates in the
# fork resolve their siblings from the fork, so a partial patch would pull in a second copy
# of reth-provider/reth-db-api/... and fail to type-check. Drop this section once both fixes
# are in the op-rs/reth rev pinned by the op-reth release.
[patch."https://github.com/op-rs/reth"]
