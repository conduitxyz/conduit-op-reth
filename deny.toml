# cargo-deny configuration
# Run with: cargo deny check

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste crate is unmaintained but widely used, no safe upgrade available" },
  { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained but used transitively by reth, no safe upgrade available" },
  # Matches upstream Optimism handling: https://github.com/ethereum-optimism/optimism/pull/21274
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is an unmaintained build-time-only transitive dep via alloy-sol-macro; no patched release exists" },
]

# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "Unlicense",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # OP Labs' shallow reth fork, pinned by the op-reth workspace to carry unreleased reth patches.
  "https://github.com/ethereum-optimism/reth",
  "https://github.com/ethereum-optimism/optimism",
  # Pinned by reth's workspace for discv5 networking.
  "https://github.com/sigp/discv5",
]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
